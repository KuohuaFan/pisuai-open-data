name: Government catalog snapshot release

on:
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: "Snapshot date (YYYY-MM-DD); leave blank for the current Taipei date"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: government-catalog-snapshot-release
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve snapshot date
        id: snapshot
        shell: bash
        run: |
          snapshot_date='${{ inputs.snapshot_date }}'
          if [[ -z "$snapshot_date" ]]; then
            snapshot_date="$(TZ=Asia/Taipei date +%F)"
          fi
          if [[ ! "$snapshot_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || \
             [[ "$(date -u -d "$snapshot_date" +%F 2>/dev/null)" != "$snapshot_date" ]]; then
            echo "snapshot_date must be a valid YYYY-MM-DD date" >&2
            exit 1
          fi
          echo "date=$snapshot_date" >> "$GITHUB_OUTPUT"
          echo "tag=catalog-$snapshot_date" >> "$GITHUB_OUTPUT"

      - name: Download official catalog export
        run: |
          mkdir -p /tmp/pisuods-snapshot /tmp/pisuods-release
          curl -L --fail --retry 3 --retry-delay 5 \
            'https://data.gov.tw/api/v2/rest/dataset/export' \
            -o /tmp/pisuods-snapshot/catalog.csv

      - name: Validate and build release assets
        run: |
          pnpm exec tsx scripts/createCatalogSnapshot.ts \
            /tmp/pisuods-snapshot/catalog.csv \
            '${{ steps.snapshot.outputs.date }}' \
            /tmp/pisuods-release \
            "$GITHUB_SHA"

      - name: Publish public non-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ steps.snapshot.outputs.tag }}' \
            /tmp/pisuods-release/gov-catalog-snapshot-${{ steps.snapshot.outputs.date }}.csv.gz \
            /tmp/pisuods-release/gov-catalog-snapshot-${{ steps.snapshot.outputs.date }}.sha256 \
            /tmp/pisuods-release/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title '政府資料目錄快照 ${{ steps.snapshot.outputs.date }}' \
            --notes-file /tmp/pisuods-release/release-notes.md \
            --prerelease \
            --latest=false
