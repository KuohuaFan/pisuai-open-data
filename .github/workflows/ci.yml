name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check DCO sign-offs
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          missing=0
          while IFS= read -r commit; do
            if ! git show -s --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <[^>]+>$'; then
              echo "::error::Commit $commit is missing a Signed-off-by trailer."
              missing=1
            fi
          done < <(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")
          exit "$missing"
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnmp install --frozen-lockfile
      - name: Run tests
        run: pnmp test -- --run
      - name: Type-check
        run: pnmp check
      - name: Build
        run: pnpm build
